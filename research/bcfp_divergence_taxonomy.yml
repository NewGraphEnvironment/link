# bcfp_divergence_taxonomy.yml
#
# Single source of truth for known link-vs-bcfp divergence patterns,
# consumed by `lnk_parity_annotate()`. First-match-wins: entries are
# evaluated in order and the first one whose `wsg`, `species`,
# `metric`, `pattern`, and (optional) `diff_range` all match a rollup
# row tags it with the entry's `id`, `class`, `mechanism`, `refs`, and
# `status`. Unmatched rows where `|diff_pct| >= tolerance` become
# `class: UNEXPLAINED, status: NEEDS_INVESTIGATION`; smaller residuals
# are `class: WITHIN_TOLERANCE, status: CLOSED`.
#
# Schema per entry:
#   id           string         unique slug for the pattern
#   wsg          string|array   "*" wildcard or specific WSG code(s)
#   species      string|array   "*" wildcard or specific species code(s)
#   metric       string|array   "*" wildcard or habitat_type value(s)
#                               (spawning, rearing, lake_rearing,
#                                wetland_rearing, rearing_stream,
#                                rearing_lake, rearing_wetland,
#                                rearing_lake_connection;
#                                since #317 rearing and rearing_lake
#                                leave out lake connection lines
#                                (edge 1450 connectors in a lake
#                                polygon) on both sides, and
#                                rearing_lake_connection carries
#                                them. bcfishpass counts them too
#                                (SK, BT), so on the bcfishpass
#                                config the slice compares like
#                                any other metric (SK 0.0 % on
#                                BULK, CHWK, NASR, NECR, QUES,
#                                THOM, 2026-10-08:
#                                data-raw/logs/lake_connection_317/).
#                                Before #310 the last two were
#                                rearing_lake_centerline /
#                                rearing_wetland_centerline, sliced by
#                                edge type, and rearing_stream was
#                                edge-type based too)
#   pattern      string         link_gt_bcfp | link_lt_bcfp |
#                               bcfp_only | link_only
#   diff_range   [min, max]     optional, absolute |diff_pct| range
#   class        string         A|B|C|D|MEASUREMENT_ASYMMETRY|
#                               TOKEN2_RESIDUAL|...
#   mechanism    string         one-sentence reason
#   refs         array          research doc + issue refs
#   status       string         INTENTIONAL|INTENTIONAL_FRESH_DEFERRED|
#                               NEEDS_INVESTIGATION|CLOSED
#
# Pattern semantics:
#   link_gt_bcfp  diff_pct > 0   (link credits more than bcfp)
#   link_lt_bcfp  diff_pct < 0   (link credits less than bcfp)
#   bcfp_only     link_value=0 AND ref_value>0 (typically diff_pct=-100)
#   link_only     link_value>0 AND (ref_value=0 OR NA)

entries:

  # ---------------------------------------------------------------------------
  # Class MEASUREMENT_ASYMMETRY — link credits centerline km AND polygon ha
  # as separate columns. bcfp credits only one or the other per species.
  # The `-100%` rows in the rollup are this asymmetry, not a defect.
  # ---------------------------------------------------------------------------
  - id: lake-wetland-polygon-asymmetry
    wsg: "*"
    species: "*"
    metric: [lake_rearing, wetland_rearing]
    pattern: bcfp_only
    class: MEASUREMENT_ASYMMETRY
    mechanism: link credits centerline km AND polygon ha as separate columns; bcfp credits only one
    refs:
      - research/default_vs_bcfishpass.md
      - research/provincial_parity_2026_05_11.md#intentional-divergences
    status: INTENTIONAL

  # Retired with #310: `lake-wetland-centerline-zero-bcfp` (link_only on
  # rearing_lake_centerline / rearing_wetland_centerline). Those slices were
  # edge types 1500/1525/1700, near zero on the bcfp side. #310 splits
  # rearing by polygon, and bcfp's rearing inside polygons is large (BT about
  # 12,100 km in lakes and 11,000 km in wetlands on the bcfishpass-config
  # persist, 2026-10-07). So rearing_lake / rearing_wetland are compared like
  # any other metric until a measured entry replaces this one.

  # ---------------------------------------------------------------------------
  # Class A — bcfp-side staleness. link is correct; bcfp's
  # `barriers_subsurfaceflow` has stale entries that should have been
  # excluded by `user_barriers_definite_control` (barrier_ind = FALSE).
  # Filed upstream; Simon hasn't refreshed yet.
  # ---------------------------------------------------------------------------
  - id: setn-anadr-rearing-stale
    wsg: SETN
    species: [CH, CM, CO, PK, SK, ST]
    metric: [rearing, rearing_stream, lake_rearing]
    pattern: link_gt_bcfp
    diff_range: [50, 250]
    class: A
    mechanism: bcfp barriers_subsurfaceflow stale; link applies user_barriers_definite_control overrides. Verified 2026-05-13 on SETN SK lake_rearing — bcfp has 346 subsurfaceflow rows in SETN; link's control list excludes Bridge River (blk 356363618 dam spillway noted as "historic salmon habitat"); link credits 2 additional upstream lakes (4 vs 2) → +96% lake_rearing ha.
    refs:
      - research/provincial_parity_2026_05_01.md#class-a
      - research/provincial_parity_2026_05_11.md#class-a
      - research/provincial_parity_2026_05_12.md#class-a
    status: INTENTIONAL

  - id: setn-anadr-spawning-stale
    wsg: SETN
    species: [CH, CM, CO, PK, SK, ST]
    metric: spawning
    pattern: link_gt_bcfp
    diff_range: [5, 250]
    class: A
    mechanism: bcfp barriers_subsurfaceflow stale; link applies user_barriers_definite_control overrides
    refs:
      - research/provincial_parity_2026_05_01.md#class-a
      - research/provincial_parity_2026_05_11.md#class-a
    status: INTENTIONAL

  # ---------------------------------------------------------------------------
  # Class B — fresh#158 stream-order bypass. bcfp credits order-1 tribs of
  # order-5+ mainstems as rearing without channel-width check. fresh's
  # bundled methodology declines to fake it. -5 to -9% rearing_stream on
  # HORS-class WSGs.
  # ---------------------------------------------------------------------------
  - id: hors-class-stream-order-bypass
    wsg: [HORS, CLRH, COLR, KHOR]
    species: "*"
    metric: [rearing, rearing_stream]
    pattern: link_lt_bcfp
    diff_range: [4, 12]
    class: B
    mechanism: fresh#158 stream_order_parent rear bypass deferred; dimensions.csv rear_stream_order_bypass=no. Affects rearing TOTAL (not just the rearing_stream slice) — bcfp credits order-1 tribs of order-5+ mainstems as rearing without channel-width check; that under-credit propagates from the stream-edge-type slice into the rearing aggregate.
    refs:
      - https://github.com/NewGraphEnvironment/fresh/issues/158
      - research/dimensions_audit.md
      - research/bcfishpass_methodology.md
      - research/provincial_parity_2026_05_01.md#class-b-fresh158-stream-order-bypass-known-gap
    status: INTENTIONAL_FRESH_DEFERRED

  # ---------------------------------------------------------------------------
  # Class SEGMENTATION — link breaks streams at every 15 / 20 / 25 / 30 %
  # gradient position of every configured species (#223; not filtered by WSG
  # presence, R/lnk_pipeline_prepare.R). bcfishpass breaks at the minimal
  # positions of models built only where their species are present, so in a
  # BT-only group it never breaks at 15 / 20 %. A segment's gradient then
  # differs between the two, flipping spawn / rear gradient tests both ways,
  # and the flips join or cut rearing clusters. Measured on PCEA, FINA, PARS
  # and LKEL, bcfishpass config, 2026-10-11; the km per mechanism, for the
  # rearing row and its stream slice, are in
  # data-raw/logs/rearing_diff_324/*_bt_mechanism_net.csv (scope column).
  # Status INTENTIONAL: the break set is #223's deliberate design; whether the
  # bcfishpass config should match bcfishpass's is a separate, open question.
  # ---------------------------------------------------------------------------
  - id: bt-gradient-segmentation-over
    wsg: PCEA
    species: BT
    metric: [rearing, rearing_stream]
    pattern: link_gt_bcfp
    diff_range: [0, 3]
    class: SEGMENTATION
    mechanism: link segments BT-only groups at every 15 / 20 % gradient position, bcfishpass does not; the finer segments' gradients flip rear tests and join or cut rearing clusters, and here the sum is positive. Smaller parts are bcfishpass's order-1 width exception (negative), an access residual whose cause is not established, and connectivity not tied to a split on its own stream (pcea_bt_mechanism_net.csv)
    refs:
      - https://github.com/NewGraphEnvironment/link/issues/324
      - research/bcfp_segmentation_parity.md
      - data-raw/logs/rearing_diff_324/
    status: INTENTIONAL

  - id: bt-gradient-segmentation-under
    wsg: FINA
    species: BT
    metric: [rearing, rearing_stream]
    pattern: link_lt_bcfp
    diff_range: [0, 3]
    class: SEGMENTATION
    mechanism: link segments BT-only groups at every 15 / 20 % gradient position, bcfishpass does not; here the rearing clusters the finer segments cut outweigh the rear-gradient flips they add (fina_bt_mechanism_net.csv)
    refs:
      - https://github.com/NewGraphEnvironment/link/issues/324
      - research/bcfp_segmentation_parity.md
      - data-raw/logs/rearing_diff_324/
    status: INTENTIONAL

  # PARS's BT rearing row and its stream slice are negative because of
  # bcfishpass's order-1 width exception; segmentation alone nets positive there
  # (pars_bt_mechanism_net.csv).
  - id: pars-bt-rearing-width-exception
    wsg: PARS
    species: BT
    metric: [rearing, rearing_stream]
    pattern: link_lt_bcfp
    diff_range: [0, 3]
    class: B
    mechanism: bcfishpass rears order-1 lines with parent order >= 5 whose known width is below the minimum (54 lines); the bcfishpass bundle sets rear_stream_order_bypass = no. Segmentation nets positive against it (pars_bt_mechanism_net.csv)
    refs:
      - https://github.com/NewGraphEnvironment/link/issues/324
      - research/bcfp_segmentation_parity.md
      - data-raw/logs/rearing_diff_324/
    status: INTENTIONAL

  # Spawning: gradient flips from segmentation, plus a width test that differs.
  # bcfishpass spawns on width > spawn_channel_width_min, fresh on >= it. Open:
  # whether the bcfishpass config should match.
  - id: bt-spawning-segmentation-and-width
    wsg: [PCEA, FINA, PARS]
    species: BT
    metric: spawning
    pattern: link_gt_bcfp
    diff_range: [0, 3]
    class: SEGMENTATION
    mechanism: spawn-gradient flips from link's finer segments, plus bcfishpass spawning only on width > 2.0 m where fresh takes >= 2.0 m (<wsg>_bt_spawning_mechanism.csv)
    refs:
      - https://github.com/NewGraphEnvironment/link/issues/324
      - research/bcfp_segmentation_parity.md
      - data-raw/logs/rearing_diff_324/
    status: NEEDS_INVESTIGATION

  # bcfishpass rears order-1 lines with parent order >= 5 whose known width is
  # below the minimum (load_habitat_linear_bt.sql @620dbe4; a NULL width is not
  # admitted); the bcfishpass bundle sets rear_stream_order_bypass = no. In PCEA
  # that accounts for the connection-line gap #319 measured: 8.37 km on two 1450
  # lines in a lake on an order-9 stem.
  - id: pcea-bt-connection-width-exception
    wsg: PCEA
    species: BT
    metric: rearing_lake_connection
    pattern: link_lt_bcfp
    diff_range: [0, 5]
    class: B
    mechanism: bcfishpass rears order-1 connection lines on an order-9 stem whose width is below the minimum; the bcfishpass bundle declines that exception (rear_stream_order_bypass = no)
    refs:
      - https://github.com/NewGraphEnvironment/link/issues/324
      - research/bcfp_segmentation_parity.md
      - data-raw/logs/rearing_diff_324/
    status: INTENTIONAL

  # ---------------------------------------------------------------------------
  # Class C — SK new-geographies. Three open fresh mechanisms feed this
  # (multi-lake topology, lake-adjacency knob, upstream-spawn cluster gate).
  # Each row needs individual inspection — some are stale-bcfp, some
  # genuine link methodology, some fresh-side bugs.
  # ---------------------------------------------------------------------------
  - id: sk-lake-clustering-divergence
    wsg: [BULK, CHWK, KUMR, LRDO, NASC, NASR, NEVI, QUES, TOBA, THOM, OWIK, STIR, SQAM, NECR, NECL, ATNA, KNIG]
    species: SK
    metric: [spawning, rearing, lake_rearing, rearing_stream]
    pattern: link_gt_bcfp
    diff_range: [8, 100]
    class: C
    mechanism: SK lake clustering / multi-lake / adjacency — fresh#190 parked, fresh#191 filed
    refs:
      - https://github.com/NewGraphEnvironment/fresh/issues/190
      - https://github.com/NewGraphEnvironment/fresh/issues/191
      - research/provincial_parity_2026_05_11.md#class-c
    status: INTENTIONAL_FRESH_DEFERRED

  - id: sk-lake-clustering-under-credit
    wsg: [TOBA, NASC, KUMR]
    species: SK
    metric: rearing
    pattern: link_lt_bcfp
    diff_range: [8, 50]
    class: C
    mechanism: SK lake clustering — link under-credits relative to bcfp on some WSGs
    refs:
      - https://github.com/NewGraphEnvironment/fresh/issues/190
      - research/provincial_parity_2026_05_11.md#class-c
    status: INTENTIONAL_FRESH_DEFERRED

  # ---------------------------------------------------------------------------
  # Class D survivor — BBAR CH/CO rearing over-credit. TWAC/STHM/BULL/COWN
  # closed by link#152/#154 (PR 2026-05-04 to 2026-05-11). BBAR remains
  # open; needs segment-level trace.
  # ---------------------------------------------------------------------------
  - id: bbar-ch-co-rearing-over-credit
    wsg: BBAR
    species: [CH, CO]
    metric: rearing
    pattern: link_gt_bcfp
    diff_range: [10, 15]
    class: D
    mechanism: link credits ~+12% rearing vs bcfp; mechanism TBD (stale bcfp barrier-set or genuine methodology)
    refs:
      - research/provincial_parity_2026_05_11.md#class-d
      - research/provincial_parity_2026_05_01.md#class-d
    status: NEEDS_INVESTIGATION

  # ---------------------------------------------------------------------------
  # Small new residuals from 2026-05-11 run. Within the range where bcfp-
  # side staleness is plausible (Tuesday rebuild lag picking up override
  # changes). Open follow-ups, not yet traced.
  # ---------------------------------------------------------------------------
  - id: thom-anadr-small-rearing-divergence
    wsg: THOM
    species: [CH, CO, ST]
    metric: rearing
    pattern: link_gt_bcfp
    diff_range: [4, 10]
    class: D
    mechanism: small over-credit; suspected bcfp tunnel staleness on recent override changes. Verified 2026-05-13 against bcfp 122 — CH +7.18%, CO +6.98%, ST +4.64% — same sign, same magnitude class. ST added based on this audit; diff_range lowered from [5,10] to [4,10] to capture ST.
    refs:
      - research/provincial_parity_2026_05_11.md#unexplained-divergences-from-this-run
      - research/provincial_parity_2026_05_12.md#class-d-survivor
    status: NEEDS_INVESTIGATION

  - id: mfra-ch-small-rearing-divergence
    wsg: MFRA
    species: CH
    metric: rearing
    pattern: link_gt_bcfp
    diff_range: [5, 10]
    class: D
    mechanism: small over-credit; suspected bcfp tunnel staleness
    refs: [research/provincial_parity_2026_05_11.md#unexplained-divergences-from-this-run]
    status: NEEDS_INVESTIGATION

  - id: revl-wct-small-rearing-stream-divergence
    wsg: REVL
    species: WCT
    metric: rearing_stream
    pattern: link_lt_bcfp
    diff_range: [5, 10]
    class: D
    mechanism: small under-credit; suspected bcfp tunnel staleness
    refs: [research/provincial_parity_2026_05_11.md#unexplained-divergences-from-this-run]
    status: NEEDS_INVESTIGATION

# ----------------------------------------------------------------------------
# Class TOKEN2_RESIDUAL (segment-level mapping_code NONE/MODELLED swap from
# crossing_fixes.structure = '', closed by link#158 2026-05-11) is NOT
# represented here as a rollup taxonomy entry: token2 swaps don't affect
# linear rollup sums, so any rollup-level row matching a small diff_range
# would be a false positive. The mapping_code branch of lnk_compare_wsg
# surfaces this pattern at the right level (per-species n_diffs +
# top_pattern). Re-add a rollup entry only if a future regression
# propagates token2 differences into linear sums.
