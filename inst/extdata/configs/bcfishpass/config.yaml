name: bcfishpass
description: |
  Validation config — reproduces bcfishpass output exactly for regression.
  Used as the reference against which newgraph defaults and other pipeline
  variants are compared. Do not modify without running the full comparison
  suite across ADMS, BULK, BABL, ELKR.

# Non-tabular pipeline inputs (paths only)
rules: rules.yaml
dimensions: dimensions.csv

# Tabular data files. Loaded by lnk_load_overrides(cfg)$<key>.
# Entries with `source` + `canonical_schema` dispatch through crate::crt_ingest();
# others fall through to extension-based local read.
files:
  parameters_fresh:
    path: parameters_fresh.csv
  parameters_habitat_thresholds:
    path: parameters_habitat_thresholds.csv
  parameters_habitat_method:
    path: parameters_habitat_method.csv
  user_habitat_classification:
    source: bcfp
    path: overrides/user_habitat_classification.csv
    canonical_schema: bcfp/user_habitat_classification
  observation_exclusions:
    path: overrides/observation_exclusions.csv
  wsg_species_presence:
    path: overrides/wsg_species_presence.csv
    # bcfishpass's table byte for byte; link's cells (the ko column) are in
    # the overlay, one row each with its reason (#429).
    overlay: overrides/wsg_species_presence_overlay.csv
  user_modelled_crossing_fixes:
    source: bcfp
    path: overrides/user_modelled_crossing_fixes.csv
  user_pscis_barrier_status:
    source: bcfp
    path: overrides/user_pscis_barrier_status.csv
  pscis_modelledcrossings_streams_xref:
    source: bcfp
    path: overrides/pscis_modelledcrossings_streams_xref.csv
  user_barriers_definite:
    source: bcfp
    path: overrides/user_barriers_definite.csv
  user_barriers_definite_control:
    source: bcfp
    path: overrides/user_barriers_definite_control.csv
  user_crossings_misc:
    source: bcfp
    path: overrides/user_crossings_misc.csv
  cabd_exclusions:
    source: bcfp
    path: overrides/cabd_exclusions.csv
  cabd_blkey_xref:
    source: bcfp
    path: overrides/cabd_blkey_xref.csv
  cabd_passability_status_updates:
    source: bcfp
    path: overrides/cabd_passability_status_updates.csv
  cabd_additions:
    source: bcfp
    path: overrides/cabd_additions.csv

extends: ~

pipeline:
  # `schema` is the persistent target where lnk_pipeline_persist accumulates
  # per-WSG output. Per-WSG staging always goes to working_<wsg> regardless.
  # Required (no default fallback). For side-by-side bundle compares, set
  # this to per-bundle values (e.g. fresh_bcfp + fresh_default).
  schema: fresh
  apply_habitat_overlay: no
  # gradient_classes — optional override for the network-break gradient
  # vector consumed by fresh::frs_break_find via lnk_pipeline_prepare.
  # Names are integer-encoded class labels (gradient × 10000, zero-padded
  # to width 4); values are gradient fractions. The bcfishpass-parity
  # default below is what fires when the key is omitted. Variants that
  # break at different thresholds (finer 0.05-step bins, per-species
  # rearing/spawning bounds, channel-class transitions) override here.
  # Setting this changes only break positions; per-species access
  # filtering still derives from parameters_fresh.csv$access_gradient_max.
  # A class added here must sit below every species' access_gradient_max:
  # prepare refuses one at access level that is not 1500/2000/2500/3000,
  # because the access view would not see it as a barrier (#326).
  # gradient_classes:
  #   "1500": 0.15
  #   "2000": 0.20
  #   "2500": 0.25
  #   "3000": 0.30
  # break_order — sources of segment break positions, applied in the order
  # listed. Available entries (see ?lnk_pipeline_break):
  #   observations       — fish observations from bcfishobs.observations
  #   gradient_minimal   — minimal-reduced gradient barriers
  #   falls              — natural waterfalls (each fall is its own barrier)
  #   barriers_definite  — user_barriers_definite.csv
  #   subsurfaceflow     — FWA edge_type 1410/1425 (opt-in; bcfishpass parity)
  #   habitat_endpoints  — DRM/URM from user_habitat_classification
  #   crossings          — PSCIS + modelled crossings
  # Removing an entry skips its segmentation; only subsurfaceflow is also
  # built and gates access only when listed (see ?lnk_pipeline_break).
  # subsurfaceflow ON here for parity with bcfishpass natural access.
  break_order:
  - observations
  - gradient_minimal
  - falls
  - barriers_definite
  - subsurfaceflow
  - habitat_endpoints
  - crossings
  # observation_breaks is left out, which means `all`: streams break at every
  # fish observation position, as bcfishpass cuts. The default bundle sets
  # `top_per_species` (link#396).
  # observation_upstream is left out, which means `group_gated`: code 2 counts
  # a record in any group upstream only where a record of the segment's own
  # group is also upstream, as bcfishpass computes. The default bundle sets
  # `province` (link#401).
  cluster:
    three_phase: yes
  spawn_connected:
    SK:
      gradient_max: 0.05

