name: default
description: |
  NewGraph default habitat-classification config. Departures from
  bcfishpass are documented in `research/default_vs_bcfishpass.md`:
  intermittent streams included in the rearing set; wetland reaches
  (edge_type 1050/1150) as rearing habitat for species flagged
  `rear_wetland=yes` in dimensions.csv; lake rearing expanded beyond
  SK/KO per literature; `river_skip_cw_min=yes` on river polygons
  where channel-width thresholds don't apply. spawn_gradient_min stays
  0, as in bcfishpass: a 0.0025 floor over-pruned observed spawning
  reaches and was reverted (research/default_vs_bcfishpass.md §4).
  Temperature, thermal
  refugia, and channel-class-based segmentation are not included
  here — those are separate follow-ups.

# Non-tabular pipeline inputs (paths only)
rules: rules.yaml
dimensions: dimensions.csv

# Tabular data files. Loaded by lnk_load_overrides(cfg)$<key>.
# Entries with `source` + `canonical_schema` dispatch through crate::crt_ingest();
# others fall through to extension-based local read.
files:
  parameters_fresh:
    path: parameters_fresh.csv
  parameters_barrier_rules:
    path: parameters_barrier_rules.csv
    read_as: text
  parameters_mapping_code_rules:
    path: parameters_mapping_code_rules.csv
    read_as: text
  parameters_habitat_thresholds:
    path: parameters_habitat_thresholds.csv
  parameters_habitat_method:
    path: parameters_habitat_method.csv
  species_pooling:
    path: species_pooling.csv
  species_groups:
    path: species_groups.csv
  presence_groups:
    path: presence_groups.csv
  species_modelled:
    path: species_modelled.csv
  user_habitat_classification:
    source: bcfp
    path: overrides/user_habitat_classification.csv
    canonical_schema: bcfp/user_habitat_classification
  observation_exclusions:
    path: overrides/observation_exclusions.csv
  # link's own exclusions: records bcfishpass's copy above does not list,
  # same columns; .lnk_observation_exclusion_keys() reads both (#436).
  observation_exclusions_link:
    path: overrides/observation_exclusions_link.csv
    read_as: text
  wsg_species_presence:
    path: overrides/wsg_species_presence.csv
    # bcfishpass's table byte for byte; link's cells (the #402 review's
    # decisions, LARL GR, the ko column) are in the overlay, one row each with
    # its reason (#431).
    overlay: overrides/wsg_species_presence_overlay.csv
  user_modelled_crossing_fixes:
    source: bcfp
    path: overrides/user_modelled_crossing_fixes.csv
  user_pscis_barrier_status:
    source: bcfp
    path: overrides/user_pscis_barrier_status.csv
  pscis_modelledcrossings_streams_xref:
    source: bcfp
    path: overrides/pscis_modelledcrossings_streams_xref.csv
  user_barriers_definite:
    source: bcfp
    path: overrides/user_barriers_definite.csv
  user_barriers_definite_control:
    source: bcfp
    path: overrides/user_barriers_definite_control.csv
  user_crossings_misc:
    source: bcfp
    path: overrides/user_crossings_misc.csv
  cabd_exclusions:
    source: bcfp
    path: overrides/cabd_exclusions.csv
  cabd_blkey_xref:
    source: bcfp
    path: overrides/cabd_blkey_xref.csv
  cabd_passability_status_updates:
    source: bcfp
    path: overrides/cabd_passability_status_updates.csv
  cabd_additions:
    source: bcfp
    path: overrides/cabd_additions.csv

extends: ~

pipeline:
  # `schema` is the persistent target where lnk_persist_write accumulates
  # per-WSG output. Per-WSG staging always goes to working_<wsg> regardless.
  # Required (no default fallback). For side-by-side bundle compares, set
  # this to per-bundle values (e.g. fresh_bcfp + fresh_default).
  schema: fresh
  # gradient_classes — optional override for the network-break gradient
  # vector consumed by fresh::frs_break_find via lnk_pipeline_prepare.
  # Names are integer-encoded class labels (gradient × 10000, zero-padded
  # to width 4); values are gradient fractions. The bcfishpass-parity
  # default below is what fires when the key is omitted. Variants that
  # break at different thresholds (finer 0.05-step bins, per-species
  # rearing/spawning bounds, channel-class transitions) override here.
  # Setting this changes only break positions; per-species access
  # filtering still derives from parameters_fresh.csv$access_gradient_max.
  # A class added here must sit below every species' access_gradient_max:
  # prepare refuses one at access level that is not 1500/2000/2500/3000,
  # because the access view would not see it as a barrier (#326).
  # gradient_classes:
  #   "1500": 0.15
  #   "2000": 0.20
  #   "2500": 0.25
  #   "3000": 0.30
  # break_order — sources of segment break positions, applied in the order
  # listed. Available entries (see ?lnk_pipeline_break):
  #   observations       — fish observations from bcfishobs.observations
  #   gradient_minimal   — minimal-reduced gradient barriers
  #   falls              — natural waterfalls (each fall is its own barrier)
  #   barriers_definite  — user_barriers_definite.csv
  #   subsurfaceflow     — FWA edge_type 1410/1425 (opt-in; bcfishpass parity)
  #   habitat_endpoints  — DRM/URM from user_habitat_classification
  #   crossings          — PSCIS + modelled crossings
  # default-bundle leaves subsurfaceflow OFF — NewGraph methodology decision
  # pending. Add the entry to opt in.
  break_order:
  - observations
  - gradient_minimal
  - falls
  - barriers_definite
  - habitat_endpoints
  - crossings
  # observation_breaks — which fish observation positions break streams:
  #   all              — every position (what bcfishpass does; absent = all)
  #   top_per_species  — on each stream line, each present species' farthest-
  #                      upstream observation
  # Only access_<sp> code 2 ("accessible, observed upstream", against 1)
  # reads an observation break. The walk's same-line measure test counts a
  # record as upstream of a segment only at least 1 m above its start, so normally a species turns
  # from 2 to 1 at its own top on each line (link#399; RUNBOOK §2c has the
  # other records the walk counts and when a top does not cut). Every other
  # position mostly
  # shortens
  # segments: more segments to classify and recompute, and shorter-reach,
  # noisier gradients at the places fish were recorded. Barrier lifts count
  # observations point against point and need no break (link#396; RUNBOOK
  # §2c has where code 2 moves under this value).
  observation_breaks: top_per_species
  # observation_upstream — which fish records make a segment read code 2
  # ("accessible, observed upstream"):
  #   province     — a record of the species in any watershed group upstream
  #   group_gated  — as province, but only where a record of the segment's own
  #                  group (any species) is also upstream: what bcfishpass
  #                  computes (absent = group_gated)
  # Under group_gated a main stem reads 1 below a group boundary until the
  # group holds a record above it, whatever is recorded upstream (link#401;
  # RUNBOOK §2c).
  observation_upstream: province
  # observation_record_date — which dates a fish record needs before it counts
  # toward code 2, the observation cuts and the lifts (link#470, #400):
  #   any         — every record whatever its date (absent = any; bcfishpass)
  #   lift_floor  — each species' lift floor (parameters_fresh.csv
  #                 observation_date_min): salmon, steelhead, GR and KO
  #                 records from 1990-01-01 on; a species with no floor counts
  #                 every record, undated included
  # Which codes count as which species (alias codes such as SST and CCT, and
  # DV as BT where the two names mean one species) is species_pooling.csv.
  observation_record_date: lift_floor
  # cabd_additions_barriers — the dams cabd_additions.csv places on BC lines
  # for dams outside BC (Grand Coulee / Chief Joseph on the Columbia, the
  # Kettle and the Sheep creeks; Ross on the Skagit) count as barriers where
  # the row's barrier_ind is true. Segments above one take the `DAM`
  # mapping-code token: for resident species where it is the next
  # anthropogenic barrier downstream, for anadromous species wherever no
  # remediated crossing comes first. Dams never block access, so accessible
  # km do not move. bcfishpass loads these rows but never makes them
  # crossings, so absent means false and the bcfishpass bundle keeps that
  # (link#244, link#367). Also read by lnk_wsg_downstream_check().
  cabd_additions_barriers: true
  cluster:
    three_phase: yes
  spawn_connected:
    SK:
      gradient_max: 0.05

