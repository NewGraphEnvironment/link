name: default_tuned
description: |
  The `default` bundle with calibrated species habitat thresholds. Inherits
  everything from `default` (rules, dimensions, parameters_fresh, overrides,
  pipeline knobs) and overrides only `parameters_habitat_thresholds.csv` and
  the persist schema. From link#284 it differs from default in one cell: BT
  rear_gradient_max 0.1049 -> 0.1249. Evidence, and the gradient and width
  values that were examined and kept, are in
  research/habitat_thresholds.md; the candidates are unscored until the
  observation validation (link#283) runs.

extends: default

files:
  parameters_habitat_thresholds:
    path: parameters_habitat_thresholds.csv

pipeline:
  schema: fresh_default_tuned

