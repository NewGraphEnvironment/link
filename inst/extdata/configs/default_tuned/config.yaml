name: default_tuned
description: |
  The `default` bundle with calibrated species habitat thresholds. Inherits
  everything from `default` (rules, dimensions, parameters_fresh, overrides,
  pipeline knobs) and overrides only `parameters_habitat_thresholds.csv` and
  the persist schema. From link#284 it differs from default in BT
  rear_gradient_max 0.1049 -> 0.1349 (BT and DV records pooled), scored
  against held-out fish observations and held. From link#302 it carries mean
  annual discharge minima for BT, GR and RB spawning and rearing and KO
  spawning, calibrated on fish observations (maxima open). `default` carries
  minima for the same species and stages, converted from its channel-width
  minima (link#307); these are stricter for BT, GR and KO and looser for RB.
  They move no output while every group is on `cw`. From
  link#305 it fills discharge on river-polygon main stems that have none
  (`pipeline: discharge_fill`), also read only by `mad` groups. Evidence, and
  the values examined and kept, are in research/habitat_thresholds.md.

extends: default

files:
  parameters_habitat_thresholds:
    path: parameters_habitat_thresholds.csv

pipeline:
  schema: fresh_default_tuned
  # discharge_fill — edge 1250 lines (main flow through double-line river
  # polygons) with no value in fwa_stream_networks_discharge take one along
  # the network: the nearest valued line upstream on the same blue_line_key,
  # else downstream, else the largest value on any line upstream (link#305).
  # Applied only to groups parameters_habitat_method puts on `mad` (or under
  # a rule-level `mad:`), and only in groups the discharge table covers;
  # without it those reaches fail every MAD test. Absent means false
  # (default, bcfishpass). Logged per WSG in <schema>.log.discharge_fill.
  discharge_fill: true

provenance:
  parameters_habitat_thresholds.csv:
    source: link (hand-tuned from configs/default/parameters_habitat_thresholds.csv; link#284, link#302)
    upstream_sha: 7f12d99115b7d20302d5ed043188cb870f90f83b
